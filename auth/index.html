<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Talaiot</title>
<meta name="theme-color" content="#15131A">
<link rel="icon" href="https://talaiottcg.com/img/favicon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<!--
  PUENTE DE LOS ENLACES DE ACCESO (29-sep-2026). Los correos de Supabase («¿Olvidaste la contraseña?»,
  confirmar la cuenta) llevan aquí: un enlace https se abre bien desde cualquier cliente de correo, y
  esta página pasa el `code` a la app (talaiot://auth-callback?code=…, o talaiotdev:// con ?app=dev).
  El canje del código lo hace LA APP: con PKCE solo sirve en el móvil que pidió el correo. Aquí no
  se lee ni se guarda nada. Si falta el código o el enlace caducó, se explica.
-->
<style>
  :root { --brand:#D11F25; --ink:#15131A; --muted:#5C574E; --stone:#F4F2EC; --card:#FFFFFF; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--stone); color:var(--ink); font:16px/1.6 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; padding:24px 16px; }
  main { width:100%; max-width:440px; background:var(--card); border-radius:22px; padding:34px 28px; text-align:center; box-shadow:0 1px 2px rgba(21,19,26,.05), 0 12px 32px -18px rgba(21,19,26,.35); border-top:4px solid var(--brand); }
  h1 { font-size:22px; line-height:1.25; margin:16px 0 8px; letter-spacing:-0.02em; }
  p { margin:0 0 14px; color:var(--muted); }
  .btn { display:inline-block; margin-top:8px; background:var(--ink); color:#fff; text-decoration:none; font-weight:800; border-radius:999px; padding:14px 26px; }
  .nota { font-size:13.5px; margin-top:18px; }
  .oculto { display:none; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#F4F2EC; --muted:#B7B0A6; --stone:#1C1C1E; --card:#2A2A2D; }
    .btn { background:#F4F2EC; color:#15131A; }
  }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="12 12 76 76" fill="none" aria-hidden="true">
  <defs><clipPath id="tlBody"><path d="M42 14 H58 Q62 14 63 19 L64 24 H66 Q78 24 79.8 37 L81 45.9 Q81.38 47 80.2 47 Q78.98 47 79.08 48.1 L79.7 51.4 Q79.8 52.5 81 52.5 L81.6 52.5 Q82.2 52.5 82.33 53.6 L85.4 74 Q87 86 73 86 H27 Q13 86 14.6 74 L17.67 53.6 Q17.8 52.5 19 52.5 L19.6 52.5 Q20.2 52.5 20.3 51.4 L20.92 48.1 Q21.02 47 19.8 47 Q18.62 47 19 45.9 L20.2 37 Q22 24 34 24 H36 L37 19 Q38 14 42 14 Z"/></clipPath></defs>
  <g clip-path="url(#tlBody)">

    <rect y="24" width="40" height="8" fill="#E0B12F"/><rect x="40" y="24" width="20" height="8" fill="#C13B2E"/><rect x="60" y="24" width="40" height="8" fill="#4E8C4A"/>
    <rect y="32" width="30" height="15" fill="#2F6FA8"/><rect x="30" y="32" width="20" height="15" fill="#4E8C4A"/><rect x="50" y="32" width="20" height="15" fill="#E0B12F"/><rect x="70" y="32" width="30" height="15" fill="#C13B2E"/>

    <path d="M43.8 86 L44.5 75.6 Q44.7 73.8 46.4 73.7 L53.6 73.7 Q55.3 73.8 55.5 75.6 L56.2 86 Z" fill="#A99C86" opacity="0.34"/>

  <path d="M42 14 H58 Q62 14 63 19 L64 24 H66 Q78 24 79.8 37 L81 45.9 Q81.38 47 80.2 47 Q78.98 47 79.08 48.1 L79.7 51.4 Q79.8 52.5 81 52.5 L81.6 52.5 Q82.2 52.5 82.33 53.6 L85.4 74 Q87 86 73 86 H27 Q13 86 14.6 74 L17.67 53.6 Q17.8 52.5 19 52.5 L19.6 52.5 Q20.2 52.5 20.3 51.4 L20.92 48.1 Q21.02 47 19.8 47 Q18.62 47 19 45.9 L20.2 37 Q22 24 34 24 H36 L37 19 Q38 14 42 14 Z" stroke="#1A1A1D" stroke-width="1.9" stroke-linejoin="round"/>

  <circle cx="50" cy="51" r="10.6" stroke="#1A1A1D" stroke-width="2.2"/>
  <circle cx="50" cy="51" r="7" fill="#1A1A1D"/>
  <circle cx="47.4" cy="48.4" r="1.8" fill="#FFFFFF"/>
</svg>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <a class="btn oculto" id="boton" href="#"></a>
  <p class="nota" id="nota"></p>
</main>
<script>
(function () {
  var T = {
    es: { abrir:'Abrir Talaiot', abriendo:'Abriendo Talaiot…', abriendoTxt:'Si no se abre sola, toca el botón.', nota:'Abre este enlace en el móvil donde tienes Talaiot y desde el que lo pediste.', caducoT:'El enlace ha caducado', caduco:'Ya se usó o ha pasado demasiado tiempo. Vuelve a pedirlo desde la app.', faltaT:'Enlace incompleto', falta:'Vuelve a pedirlo desde la app y ábrelo sin cambiarlo.' },
    en: { abrir:'Open Talaiot', abriendo:'Opening Talaiot…', abriendoTxt:'If it doesn’t open on its own, tap the button.', nota:'Open this link on the phone where you have Talaiot and that you requested it from.', caducoT:'This link has expired', caduco:'It has already been used or too much time has passed. Request it again from the app.', faltaT:'Incomplete link', falta:'Request it again from the app and open it without changing it.' },
    ca: { abrir:'Obre Talaiot', abriendo:'Obrint Talaiot…', abriendoTxt:'Si no s’obre sola, toca el botó.', nota:'Obre aquest enllaç al mòbil on tens Talaiot i des del qual el vas demanar.', caducoT:'L’enllaç ha caducat', caduco:'Ja s’ha fet servir o ha passat massa temps. Torna’l a demanar des de l’app.', faltaT:'Enllaç incomplet', falta:'Torna’l a demanar des de l’app i obre’l sense canviar-lo.' },
    fr: { abrir:'Ouvrir Talaiot', abriendo:'Ouverture de Talaiot…', abriendoTxt:'Si elle ne s’ouvre pas toute seule, touchez le bouton.', nota:'Ouvrez ce lien sur le téléphone où vous avez Talaiot et depuis lequel vous l’avez demandé.', caducoT:'Ce lien a expiré', caduco:'Il a déjà été utilisé ou trop de temps s’est écoulé. Redemandez-le depuis l’app.', faltaT:'Lien incomplet', falta:'Redemandez-le depuis l’app et ouvrez-le sans le modifier.' },
    de: { abrir:'Talaiot öffnen', abriendo:'Talaiot wird geöffnet …', abriendoTxt:'Falls sie sich nicht von selbst öffnet, tippe auf den Button.', nota:'Öffne diesen Link auf dem Handy, auf dem du Talaiot hast und von dem aus du ihn angefordert hast.', caducoT:'Der Link ist abgelaufen', caduco:'Er wurde schon verwendet oder es ist zu viel Zeit vergangen. Fordere ihn in der App neu an.', faltaT:'Unvollständiger Link', falta:'Fordere ihn in der App neu an und öffne ihn, ohne ihn zu verändern.' },
    it: { abrir:'Apri Talaiot', abriendo:'Apertura di Talaiot in corso…', abriendoTxt:'Se non si apre da sola, tocca il pulsante.', nota:'Apri questo link sul telefono dove hai Talaiot e da cui l’hai richiesto.', caducoT:'Il link è scaduto', caduco:'È già stato usato o è passato troppo tempo. Richiedilo di nuovo dall’app.', faltaT:'Link incompleto', falta:'Richiedilo di nuovo dall’app e aprilo senza modificarlo.' },
    pt: { abrir:'Abrir o Talaiot', abriendo:'Abrindo o Talaiot…', abriendoTxt:'Se não abrir sozinho, toque no botão.', nota:'Abra este link no celular em que você tem o Talaiot e de onde fez o pedido.', caducoT:'O link expirou', caduco:'Ele já foi usado ou passou tempo demais. Peça de novo pelo app.', faltaT:'Link incompleto', falta:'Peça de novo pelo app e abra o link sem alterá-lo.' }
  };
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var nav = (q.get('lang') || navigator.language || 'es').toLowerCase();
  var lang = nav.indexOf('ca') === 0 ? 'ca' : (T[nav.slice(0, 2)] ? nav.slice(0, 2) : 'en');
  var t = T[lang];
  document.documentElement.lang = lang;
  var $ = function (id) { return document.getElementById(id); };
  var code = q.get('code');
  var error = q.get('error_code') || h.get('error_code') || q.get('error') || h.get('error');
  $('nota').textContent = t.nota;
  if (error) { $('titulo').textContent = t.caducoT; $('texto').textContent = t.caduco; return; }
  if (!code || !/^[\w-]{6,200}$/.test(code)) { $('titulo').textContent = t.faltaT; $('texto').textContent = t.falta; return; }
  var esquema = q.get('app') === 'dev' ? 'talaiotdev' : 'talaiot';
  var destino = esquema + '://auth-callback?code=' + encodeURIComponent(code);
  $('titulo').textContent = t.abriendo;
  $('texto').textContent = t.abriendoTxt;
  var b = $('boton'); b.href = destino; b.textContent = t.abrir; b.className = 'btn';
  setTimeout(function () { location.href = destino; }, 150);
})();
</script>
</body>
</html>
