<!--
  PÁGINA DE LOS ENLACES DE ACCESO (29-sep-2026; rehecha el 30-sep). Los correos de Supabase
  («¿Olvidaste la contraseña?», confirmar la cuenta) traen aquí un `token_hash` de un solo uso.
  · Contraseña: se cambia AQUÍ, en la web, en cualquier aparato (ordenador o móvil, con cualquier
    versión de la app). El enlace NO se gasta al abrirlo: solo al guardar la contraseña nueva, así
    que se puede abrir varias veces dentro de su plazo (y los antivirus del correo que «visitan» los
    enlaces tampoco lo queman).
  · Confirmar cuenta: un botón; el enlace se gasta al tocarlo.
  · Enlaces viejos con `code` (PKCE, 29-sep): se siguen pasando a la app como antes.
  Aquí no se guarda nada: la sesión de un solo uso vive en memoria y se cierra al acabar.
  La URL y la clave pública (anon) de Supabase las pone scripts/deploy-web.mjs al publicar.
-->

  .card { background:#fff; color:var(--ink); border-radius:22px; padding:24px 22px 26px; box-shadow:0 40px 70px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.12); }

    pinta(t.passT, t.passSub);
    $('l1').textContent = t.l1; $('clave1').placeholder = t.ph1;
    $('l2').textContent = t.l2; $('clave2').placeholder = t.l2;
    $('guardar').textContent = t.guardar;
    $('formulario').className = 'card';
    var sesion = null;   // si guardar falla DESPUÉS de verificar, se reintenta con esta sesión (el enlace ya no vale)
    $('formulario').addEventListener('submit', function (e) {
      e.preventDefault();
      var c1 = $('clave1').value, c2 = $('clave2').value;
      if (c1.length < 6) { $('error').textContent = t.corta; return; }
      if (c1 !== c2) { $('error').textContent = t.noCoinciden; return; }
      $('error').textContent = '';
      var boton = $('guardar'); boton.disabled = true; boton.textContent = t.guardando;
      var suelta = function (msg) { boton.disabled = false; boton.textContent = t.guardar; $('error').textContent = msg; };
      (sesion ? Promise.resolve({ ok: true, j: sesion }) : verificar(tokenHash, 'recovery'))
        .then(function (v) {
          if (!v.ok || !v.j.access_token) { if (enlaceGastado(v)) caducado(); else suelta(t.fallo); return; }
          sesion = v.j;
          return api('PUT', '/user', { password: c1 }, sesion.access_token).then(function (u) {
            if (!u.ok) {
              var c = u.j.error_code || '';
              suelta(c === 'same_password' ? t.igual : c === 'weak_password' ? t.debil : t.fallo);
              return;
            }
            // Cerrar esta sesión de un solo uso: la cuenta se usa en la app, no aquí.
            api('POST', '/logout?scope=local', null, sesion.access_token).catch(function () {});
            sesion = null;
            $('formulario').className = 'card oculto';
            $('ok').className = 'ok';
            pinta(t.listoT, t.listo);
            botonApp();
          });
        })
        .catch(function () { suelta(t.fallo); });
    });
    return;
  }

  // ── CONFIRMAR LA CUENTA ── un toque (así los antivirus del correo que abren enlaces no la gastan).
  if (tokenHash && (tipo === 'email' || tipo === 'signup')) {
    pinta(t.confT, t.conf);
    var bc = $('boton'); bc.href = '#'; bc.textContent = t.confBtn; bc.className = 'btn';
    var enCurso = false;
    bc.addEventListener('click', function (e) {
      e.preventDefault();
      if (enCurso) return; enCurso = true;
      verificar(tokenHash, tipo).then(function (v) {
        enCurso = false;
        if (!v.ok) { if (enlaceGastado(v)) { bc.className = 'btn oculto'; caducado(); } else $('texto').textContent = t.fallo; return; }
        if (v.j.access_token) api('POST', '/logout?scope=local', null, v.j.access_token).catch(function () {});
        bc.className = 'btn oculto';
        $('ok').className = 'ok';
        pinta(t.confOkT, t.confOk);
        botonApp();
      }).catch(function () { enCurso = false; $('texto').textContent = t.fallo; });
    });
    return;
  }

  // ── ENLACES VIEJOS (29-sep, PKCE): el `code` solo lo puede canjear la app que pidió el correo.
  var code = q.get('code');
  if (!code || !/^[\w-]{6,200}$/.test(code)) { pinta(t.faltaT, t.falta); return; }
  $('nota').textContent = t.nota;
  var destino = esquema + '://auth-callback?code=' + encodeURIComponent(code);
  pinta(t.abriendo, t.abriendoTxt);
  var b = $('boton'); b.href = destino; b.textContent = t.abrir; b.className = 'btn';
  setTimeout(function () { location.href = destino; }, 150);
})();
</script>
</body>
</html>
